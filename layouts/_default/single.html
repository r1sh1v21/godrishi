{{ define "main" }}
{{ if in (slice "posts" "post") .Type }}
<article class="post-article">
    <header class="post-header">
        <div class="post-header-star" aria-hidden="true">
            <img src="{{ "images/sigils/star-large.png" | relURL }}" alt="✦" class="header-star-sigil">
        </div>
        <h1 class="post-title">{{ .Title }}</h1>
        <div class="post-meta">
            <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 Jan 2006" }}</time>
            {{ with .Params.category }}
            <span class="meta-sep">&bull;</span>
            <span class="meta-category">{{ . }}</span>
            {{ end }}
            <span class="meta-sep">&bull;</span>
            <span class="meta-readtime">{{ .ReadingTime }} min read</span>
        </div>
        <div class="post-header-rule" aria-hidden="true">
            <img src="{{ "images/sigils/divider-bar-4.png" | relURL }}" alt="---" class="post-rule-img">
        </div>
    </header>
    <div class="post-body">
        {{ .Content }}
    </div>
    <div class="post-seal" aria-hidden="true">
        <img src="{{ "images/sigils/chandelier-drop.png" | relURL }}" alt="❦" class="seal-img">
    </div>
</article>
{{ else }}
<article class="page-article">
    <header class="page-header">
        <h1 class="page-title">{{ .Title }}</h1>
        <div class="page-header-rule" aria-hidden="true">
            <img src="{{ "images/sigils/divider-bar-4.png" | relURL }}" alt="---" class="post-rule-img">
        </div>
    </header>
    <div class="page-body">
        {{ .Content }}
    </div>
    <div class="page-seal" aria-hidden="true">
        <img src="{{ "images/sigils/cross-thorns.png" | relURL }}" alt="❦" class="seal-img">
    </div>
</article>
{{ end }}
{{ end }}
